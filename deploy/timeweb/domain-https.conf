# /etc/systemd/system/nevidimy.service.d/public-domain-https.conf (after http-local.conf)
[Service]
ExecStart=
ExecStart=/usr/bin/python3 /opt/nevidimy/app/scripts/chatwoot_compose.py up -d --no-build --pull never --wait --wait-timeout 240 redis chatwoot sidekiq caddy
ExecStop=
ExecStop=/usr/bin/python3 /opt/nevidimy/app/scripts/chatwoot_compose.py stop caddy sidekiq chatwoot redis
