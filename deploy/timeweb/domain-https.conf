# /etc/systemd/system/nevidimy.service.d/public-domain-https.conf (after http-local.conf)
[Service]
ExecStart=
ExecStart=/usr/bin/docker compose --env-file /etc/women-help-chatwoot.env -f deploy/chatwoot/compose.yml -f deploy/chatwoot/compose.managed.yml -f deploy/timeweb/compose.yml -f deploy/timeweb/compose.domain-https.yml up -d --no-build --pull never --wait --wait-timeout 240 redis chatwoot sidekiq caddy
ExecStop=
ExecStop=/usr/bin/docker compose --env-file /etc/women-help-chatwoot.env -f deploy/chatwoot/compose.yml -f deploy/chatwoot/compose.managed.yml -f deploy/timeweb/compose.yml -f deploy/timeweb/compose.domain-https.yml stop caddy sidekiq chatwoot redis
