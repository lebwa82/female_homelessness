services:
  postgres:
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_DB: women_help
      POSTGRES_USER: helper
      # Local development uses the fallback; production sets a distinct value
      # in the systemd EnvironmentFile.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-helper}
      POSTGRES_INITDB_ARGS: --username=helper
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data_v18_helper:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helper -d women_help"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data_v18_helper:
