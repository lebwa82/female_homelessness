[project]
name = "women-help-bot"
version = "0.1.0"
description = "Safety-first Telegram MVP for first contact with women facing homelessness"
requires-python = ">=3.14"
dependencies = [
  "aiogram",
  "aiohttp-socks>=0.11.0",
  "asyncpg",
  "greenlet",
  "openai",
  "presidio-analyzer>=2.2.364",
  "presidio-anonymizer>=2.2.364",
  "pydantic-ai-slim[openai]>=2.32.1",
  "pydantic-settings",
  "ru-core-news-sm",
  "sqlalchemy",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.uv.sources]
ru-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/ru_core_news_sm-3.8.0/ru_core_news_sm-3.8.0-py3-none-any.whl" }
